plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'idea'
    id 'builder.kasuga.generator'
    id 'builder.kasuga.monorepo'
}

version = mod_version
group = mod_group_id

// Opt-in sources for integration against an installed official Sable distribution. The optional
// production adapter itself only compiles against Companion and does not load Sable by default.
def sableSmokeJar = providers.gradleProperty('kasugaSableSmokeJar')

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven {
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroup 'dev.ryanhcode.sable-companion' }
        // This optional API is self-contained; Minecraft supplies JOML and annotations.
        metadataSources { artifact() }
    }
    maven {
        url "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }
}

useModProject(project(':modules:core'))
// The Create preview demos reuse modelling's selector and smoke fixtures, so both
// main and contentTesting must share the mod layer and its runtime dependencies below.
useModProject(project(':modules:modelling'))
// NeoForge source-set registration is not transitive. Keep the rendering classes in the
// same mod class loader as their Minecraft callers in dev runs and integration tests.
useModProject(project(':modules:render-core'))
useModProject(project(':modules:render-opengl'))
// Compile against data-driven while packing its main source set into this mod layer. A runtime
// project dependency would also put its GAMELIBRARY jar on the module path and split its packages
// from kasuga_lib.
useModProject(project(':modules:data-driven'), false)



sourceSets {
    contentTesting {
        java {
            srcDir 'src/contentTesting/java'
            if (sableSmokeJar.isPresent()) srcDir 'src/sableTesting/java'
        }
        resources {
            srcDir 'src/contentTesting/resources'
        }

        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output

        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }

    test {
        compileClasspath += sourceSets.contentTesting.output
        runtimeClasspath += sourceSets.contentTesting.output
    }
}

tasks.named('processContentTestingResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

configurations {
    shadowLibrary
    implementation.extendsFrom shadowLibrary
}

test {
    useJUnitPlatform()
}

useGenerator()


// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = file(providers.gradleProperty('kasugaClientDirectory').getOrElse('run/client'))
            def world = providers.gradleProperty('kasugaQuickPlayWorld')
            if (world.isPresent()) programArguments.addAll '--quickPlaySingleplayer', world.get()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientHeadless {
            client()
            gameDirectory = file(providers.gradleProperty('kasugaClientDirectory').getOrElse('run/headless-client'))
            systemProperty 'kasuga.headless', providers.gradleProperty('kasugaHeadlessBackend').getOrElse('hidden')
            systemProperty 'kasuga.headless.fps', '60'
            systemProperty 'java.awt.headless', 'true'
            def world = providers.gradleProperty('kasugaQuickPlayWorld')
            if (world.isPresent()) programArguments.addAll '--quickPlaySingleplayer', world.get()
            def glfw = providers.gradleProperty('kasugaHeadlessGlfwLibrary')
            if (glfw.isPresent()) systemProperty 'org.lwjgl.glfw.libname', file(glfw.get()).absolutePath
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            if (providers.gradleProperty('kasugaTestMinecraftPreview').getOrElse('false').toBoolean()) {
                systemProperty 'kasuga.testMinecraftPreview', 'true'
            }
            if (providers.gradleProperty('kasugaMinecraftPreviewInteractive').getOrElse('false').toBoolean()) {
                systemProperty 'kasuga.minecraftPreview.interactive', 'true'
            }
            if (providers.gradleProperty('kasugaCreateGallery').getOrElse('false').toBoolean()) {
                systemProperty 'kasuga.createGallery.auto', 'true'
            }
            if (providers.gradleProperty('kasugaTestCreateGallery').getOrElse('false').toBoolean()) {
                systemProperty 'kasuga.testCreateGallery', 'true'
            }
            systemProperty 'kasuga.createMountDemo', providers.gradleProperty('kasugaCreateMountDemo').getOrElse('false')
            systemProperty 'kasuga.testCreateMounts', providers.gradleProperty('kasugaTestCreateMounts').getOrElse('false')
            systemProperty 'kasuga.testSableScene', providers.gradleProperty('kasugaTestSableScene').getOrElse('false')
            def previewSchematic = providers.gradleProperty('kasugaPreviewSchematic')
            if (previewSchematic.isPresent()) systemProperty 'kasuga.minecraftPreview.schematic', file(previewSchematic.get()).absolutePath
            def previewOutput = providers.gradleProperty('kasugaMinecraftPreviewOutput')
            if (previewOutput.isPresent()) systemProperty 'kasuga.minecraftPreview.output', rootProject.file(previewOutput.get()).absolutePath

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            // Inlcude the core subproject as a dependency.
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.contentTesting)
        }
    }

    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

tasks.register('prepareHeadlessClient') {
    def directory = file(providers.gradleProperty('kasugaClientDirectory').getOrElse('run/headless-client'))
    doLast {
        def config = new File(directory, 'config/fml.toml')
        config.parentFile.mkdirs()
        def text = config.exists() ? config.getText('UTF-8') : ''
        text = text.replaceAll(/(?m)^\s*earlyWindowControl\s*=.*$/, '')
        config.setText(text + '\nearlyWindowControl = false\n', 'UTF-8')
    }
}
tasks.matching { it.name in ['runClientHeadless', 'prepareClientHeadlessRun'] }.configureEach {
    dependsOn 'prepareHeadlessClient'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0') { transitive = false }
    testImplementation('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0') { transitive = false }
    if (sableSmokeJar.isPresent()) contentTestingCompileOnly files(sableSmokeJar.get())
    implementation ("io.micronaut:micronaut-inject:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }

    additionalRuntimeClasspath ("io.micronaut:micronaut-inject:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }

    additionalRuntimeClasspath ("io.micronaut:micronaut-aop:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }
    additionalRuntimeClasspath 'com.google.zxing:core:3.5.3'

    implementation project(":modules:inject")

    implementation project(":modules:utils")

    // modelling is mirrored into this mod layer through useModProject(), which only contributes
    // compileOnly. A real dependency is needed so its runtime-only libraries (formula, shader, utils,
    // twelvemonkeys) are on this run configuration's classpath.
    implementation project(":modules:modelling")

    // modelling lists these as additionalRuntimeClasspath/shadowLibrary, which are not transitive:
    // its pipeline loads them at class-init time (post-processing, glTF, IK), so mirror them here.
    // shader/formula are `api` deps of modelling and are on runtimeClasspath, but ModDev assembles
    // the run's legacy classpath from this configuration, so they must be listed explicitly too.
    additionalRuntimeClasspath project(":modules:shader")
    additionalRuntimeClasspath project(":modules:formula")
    additionalRuntimeClasspath 'org.jgrapht:jgrapht-core:1.5.2'
    additionalRuntimeClasspath("de.javagl:jgltf-model:2.0.4")
    additionalRuntimeClasspath("de.javagl:jgltf-impl-v2:2.0.4")
    additionalRuntimeClasspath files(project(':modules:render-core').file('libs/caliko-1.3.8.jar'))

    testImplementation project(":modules:core")

    implementation("cc.tweaked:cc-tweaked-$minecraft_version-forge:$cct_version")

    annotationProcessor 'io.micronaut:micronaut-inject-java:4.9.10'
    contentTestingAnnotationProcessor 'io.micronaut:micronaut-inject-java:4.9.10'


    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")



    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.neoforged:testframework:${project.neo_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
