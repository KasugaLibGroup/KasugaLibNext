plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
    id("com.gradleup.shadow") version '9.0.2'
    id 'idea'
    id 'builder.kasuga.generator'
    id 'builder.kasuga.monorepo'
}
import builder.kasuga.MicronautServiceShadowTransformer

version = mod_version
group = mod_group_id

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven {
        url "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }
}


useModProject(project(':modules:scripting'))
useModProject(project(':modules:modelling'))
useModProject(project(':modules:render-core'))
useModProject(project(':modules:render-opengl'))
useModProject(project(':modules:core'))
useModProject(project(':modules:create'))
useModProject(project(':modules:data-driven'))

test {
    useJUnitPlatform()
}

sourceSets {
    contentTesting {
        java {
            srcDir 'src/contentTesting/java'
        }
        resources {
            srcDir 'src/contentTesting/resources'
        }

        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output

        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

configurations {
    shadowLibrary
    implementation.extendsFrom shadowLibrary
}


// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java {
    withSourcesJar()
    withJavadocJar()
}

tasks.named('sourcesJar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn(
            ':modules:core:generateModMetadata',
            ':modules:scripting:generateModMetadata',
            ':modules:modelling:generateModMetadata',
            ':modules:create:generateModMetadata'
    )
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            // Inlcude the core subproject as a dependency.
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.contentTesting)
        }
    }
}

dependencies {
    implementation ("io.micronaut:micronaut-inject:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }

    additionalRuntimeClasspath ("io.micronaut:micronaut-inject:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }

    additionalRuntimeClasspath ("io.micronaut:micronaut-aop:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }

    implementation project(":modules:inject")
    shadowLibrary project(":modules:inject")

    implementation project(":modules:utils")
    shadowLibrary project(":modules:utils")

    api project(":modules:shader")
    shadowLibrary project(":modules:shader")

    api project(':modules:render-core')
    api project(':modules:render-opengl')
    // useModProject embeds project classes; these parser dependencies need to
    // be embedded separately, as they are not provided by Minecraft.
    shadowLibrary 'de.javagl:jgltf-model:2.0.4'
    shadowLibrary 'de.javagl:jgltf-impl-v2:2.0.4'
    shadowLibrary files(project(':modules:render-core').file('libs/caliko-1.3.8.jar'))
    additionalRuntimeClasspath 'de.javagl:jgltf-model:2.0.4'
    additionalRuntimeClasspath 'de.javagl:jgltf-impl-v2:2.0.4'
    additionalRuntimeClasspath files(project(':modules:render-core').file('libs/caliko-1.3.8.jar'))


    implementation("cc.tweaked:cc-tweaked-$minecraft_version-forge:$cct_version")


    additionalRuntimeClasspath 'com.google.zxing:core:3.5.3'
    shadowLibrary 'com.google.zxing:core:3.5.3'


    annotationProcessor 'io.micronaut:micronaut-inject-java:4.9.10'

    contentTestingAnnotationProcessor 'io.micronaut:micronaut-inject-java:4.9.10'

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources') {
    from(project(':modules:render-core').file('libs/caliko-LICENSE.txt')) {
        into 'META-INF/licenses'
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

shadowJar {
    mergeServiceFiles()
    configurations = [project.configurations.shadowLibrary]
    archiveClassifier.set('all')

    transform(MicronautServiceShadowTransformer) {}


    from(sourceSets.main.output)

    relocate 'io.micronaut', 'lib.kasuga.vendors.io.micronaut'
    relocate 'jakarta.inject', 'lib.kasuga.vendors.jakarta.inject'
    relocate 'jakarta.annotation', 'lib.kasuga.vendors.jakarta.annotation'
    relocate 'lib.kasuga.inject', 'lib.kasuga.vendors.inject'

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}


assemble.dependsOn shadowJar
