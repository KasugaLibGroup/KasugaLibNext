plugins {
    id 'java-library'
    id 'maven-publish'
}

group = mod_group_id
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

def graalVersion = '24.1.2'

dependencies {
    api project(':modules:shader')
    implementation "org.graalvm.polyglot:polyglot:${graalVersion}"
    // The js-community aggregator resolves to these two runtime jars. Depending on them
    // directly keeps POM files off NeoForge's classpath, whose union filesystem scans
    // every runtime entry as a jar. It also publishes ordinary jar dependencies to Maven.
    runtimeOnly "org.graalvm.js:js-language:${graalVersion}"
    runtimeOnly "org.graalvm.truffle:truffle-runtime:${graalVersion}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Development-only exporters; these classes do not enter the published library.
sourceSets {
    showcase {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('exportShowcase', JavaExec) {
    group = 'application'
    description = 'Compiles the Prism Scan JavaScript example and exports typed IR and Minecraft shader resources.'
    mainClass = 'lib.kasuga.shader.showcase.ShowcaseExport'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = sourceSets.showcase.runtimeClasspath
    args rootProject.file('examples/shader-dsl/prism-scan.js').absolutePath,
            rootProject.file(providers.gradleProperty('kasugaShowcaseOutput').getOrElse('build/shader-showcase')).absolutePath
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
