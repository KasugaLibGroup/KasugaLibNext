// Isolated Sable 2.0.6 development profile. Pass this file with -I; normal builds retain their
// existing NeoForge/Create versions.
allprojects {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute(module('net.createmod.ponder:ponder-neoforge'))
                    .using(module('net.createmod.ponder:ponder-neoforge:1.0.92+mc1.21.1'))
        }
    }
}
