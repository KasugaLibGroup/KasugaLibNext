plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.107' apply false
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Every subproject gets a UNIQUE jar name derived from its gradle project name. moddev derives the run
// module-layer module name from the jar file name, so two jars sharing a name (e.g. several
// `kasuga_lib-*.jar`) collapse into one module and break classloading (NoClassDefFoundError: NeoForge).
// `mod_id` is the shared neoforge MOD id (kasuga_lib) — it must NOT be used as the jar (archive) name.
// Per-module `base { archivesName = ... }` overrides are therefore unnecessary and removed.
subprojects {
    plugins.withId('base') {
        base {
            archivesName = "kasuga-${project.name}"
        }
    }
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('renderingReleaseCheck') {
    group = 'verification'
    description = 'Builds and verifies the custom rendering pipeline and shader DSL release surface.'
    dependsOn(
            gradle.includedBuild('gradle-plugin').task(':test'),
            ':modules:shader:test',
            ':modules:shader:assemble',
            ':modules:render-core:assemble',
            ':modules:render-opengl:assemble',
            ':modules:modelling:modelUnitTest',
            ':modules:modelling:compileContentTestingJava',
            ':modules:modelling:jar',
            ':modules:modelling:sourcesJar',
            ':modules:modelling:javadocJar',
            ':modules:library:assemble'
    )
}
